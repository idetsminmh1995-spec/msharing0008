<?xml version="1.0" encoding="utf-8"?>
<!--
  A classical guitar, drawn by the site's owner in Illustrator and
  turned on its side: headstock in from the LEFT, body out to the
  right, which is the way every guitar on the video page lies.

  Built from `Classic Guitar.svg` in this folder, which is the upright
  original. Two things were changed and nothing else: the whole
  drawing is rotated a quarter turn, and the two middle strings were
  moved 1.7 units at the nut onto the even spacing the engine's model
  assumes (they were drawn 8.4 apart where the others are 12.5).

  Upright, the low E is on the left; a quarter turn counter-clockwise
  puts it at the BOTTOM, which is where the engine numbers string 6.
-->

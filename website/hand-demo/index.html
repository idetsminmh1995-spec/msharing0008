<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Rigged Human Hand — Blender / Three.js Test</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #11151b; color: #eaf0f7; }
    main { display: grid; grid-template-columns: minmax(0, 1fr) 310px; min-height: 100vh; }
    #stage { position: relative; min-height: 620px; background: radial-gradient(circle at 50% 42%, #293241, #101318 70%); }
    canvas { display: block; width: 100%; height: 100%; min-height: 620px; }
    aside { padding: 22px; border-left: 1px solid #2a3441; background: #171c23; }
    h1 { margin: 0 0 8px; font-size: 21px; }
    p { color: #aeb9c8; line-height: 1.5; font-size: 14px; }
    .group { margin: 20px 0; }
    .group-title { margin-bottom: 8px; color: #7ed6ff; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
    button { margin: 0 6px 8px 0; padding: 9px 11px; border: 1px solid #415166; border-radius: 7px; color: #edf5ff; background: #263244; cursor: pointer; }
    button:hover { background: #33445c; }
    button.active { border-color: #70d3ff; background: #1d637c; }
    #status { padding: 10px; border-radius: 7px; background: #10151b; color: #aeb9c8; font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap; }
    #bones { max-height: 205px; overflow: auto; padding: 10px; border-radius: 7px; background: #10151b; color: #9daabd; font: 11px/1.55 ui-monospace, monospace; }
    .credit { position: absolute; left: 14px; bottom: 12px; padding: 7px 9px; border-radius: 5px; background: #10151bcc; color: #b8c5d4; font-size: 11px; }
    a { color: #83d8ff; }
    @media (max-width: 800px) { main { grid-template-columns: 1fr; } aside { border-left: 0; border-top: 1px solid #2a3441; } }
  </style>
</head>
<body>
<main>
  <section id="stage">
    <div class="credit">CC BY-NC 4.0 model · Three.js GLB test</div>
  </section>
  <aside>
    <h1>Rigged human hand</h1>
    <p>This test loads the Blender model, its skin, 21-bone armature, and embedded animation clips. Drag to orbit; scroll to zoom.</p>

    <div class="group">
      <div class="group-title">Embedded poses</div>
      <button data-clip="neutral">Neutral</button>
      <button data-clip="Pose_OK">OK gesture</button>
      <button data-clip="RigAction">Rig action</button>
      <button id="stop">Stop</button>
    </div>

    <div class="group">
      <div class="group-title">Direct bone test</div>
      <button id="curl">Curl index finger</button>
      <button id="uncurl">Release index finger</button>
      <button id="reset">Reset pose</button>
    </div>

    <div class="group">
      <div class="group-title">Load status</div>
      <div id="status">Loading hand_model.glb…</div>
    </div>

    <div class="group">
      <div class="group-title">Armature bones</div>
      <pre id="bones">Waiting for model…</pre>
    </div>
  </aside>
</main>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const stage = document.querySelector('#stage');
const status = document.querySelector('#status');
const bonesOutput = document.querySelector('#bones');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x11151b);

const camera = new THREE.PerspectiveCamera(32, 1, 0.01, 100);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
stage.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0.1, 0);

scene.add(new THREE.HemisphereLight(0xe8f3ff, 0x26303b, 2.2));
const key = new THREE.DirectionalLight(0xffffff, 3.2);
key.position.set(3, 5, 4);
key.castShadow = true;
scene.add(key);
const rim = new THREE.DirectionalLight(0x6cb9ff, 1.4);
rim.position.set(-4, 2, -3);
scene.add(rim);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(3, 64),
  new THREE.MeshStandardMaterial({ color: 0x1a222d, roughness: 0.82, metalness: 0.05 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -1.3;
floor.receiveShadow = true;
scene.add(floor);

let root;
let mixer;
let clips = [];
let initialQuaternions = new Map();
let boneMap = new Map();
let activeAction;

function resize() {
  const width = stage.clientWidth;
  const height = Math.max(stage.clientHeight, 620);
  camera.aspect = width / height;
  camera.updateProjectionMatrix();
  renderer.setSize(width, height, false);
}
addEventListener('resize', resize);
resize();

function fitCamera(object) {
  const box = new THREE.Box3().setFromObject(object);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const radius = Math.max(size.x, size.y, size.z) * 0.62;
  camera.position.set(center.x + radius * 0.55, center.y + radius * 0.38, center.z + radius * 2.8);
  camera.near = Math.max(radius / 100, 0.001);
  camera.far = radius * 20;
  camera.updateProjectionMatrix();
  controls.target.copy(center);
  controls.target.y -= size.y * 0.04;
  controls.update();
}

function stopActions() {
  if (!mixer) return;
  mixer.stopAllAction();
  activeAction = undefined;
  document.querySelectorAll('[data-clip]').forEach((button) => button.classList.remove('active'));
}

function playClip(name) {
  if (name === 'neutral') {
    stopActions();
    if (root) root.rotation.set(0, 0, 0);
    status.textContent = `Neutral pose\nBones: ${boneMap.size}\nAnimations: ${clips.map((clip) => clip.name).join(', ') || 'none'}`;
    return;
  }
  const clip = clips.find((item) => item.name === name);
  if (!clip) return;
  stopActions();
  activeAction = mixer.clipAction(clip);
  activeAction.reset().setLoop(THREE.LoopRepeat, Infinity).fadeIn(0.25).play();
  document.querySelector(`[data-clip="${CSS.escape(name)}"]`)?.classList.add('active');
  status.textContent = `Playing ${name}\nBones: ${boneMap.size}\nDuration: ${clip.duration.toFixed(2)}s`;
}

document.querySelectorAll('[data-clip]').forEach((button) => {
  button.addEventListener('click', () => playClip(button.dataset.clip));
});
document.querySelector('#stop').addEventListener('click', () => { stopActions(); status.textContent = 'Animation stopped; current pose is preserved.'; });
document.querySelector('#reset').addEventListener('click', () => {
  stopActions();
  boneMap.forEach((bone, name) => {
    const initial = initialQuaternions.get(name);
    if (initial) bone.quaternion.copy(initial);
  });
  status.textContent = 'All bones reset to the imported neutral pose.';
});
document.querySelector('#curl').addEventListener('click', () => {
  stopActions();
  ['index_meta', 'index_prox', 'index_midd', 'index_dist'].forEach((name, index) => {
    const bone = boneMap.get(name);
    if (bone) bone.rotation.x = -(0.35 + index * 0.08);
  });
  status.textContent = 'Direct bone test: index finger curled for a piano-key target.';
});
document.querySelector('#uncurl').addEventListener('click', () => {
  ['index_meta', 'index_prox', 'index_midd', 'index_dist'].forEach((name) => {
    const bone = boneMap.get(name);
    if (bone) bone.rotation.x = 0;
  });
  status.textContent = 'Direct bone test: index finger released.';
});

new GLTFLoader().load(
  '../assets/hand/hand_model.glb',
  (gltf) => {
    root = gltf.scene;
    root.scale.setScalar(1.45);
    root.rotation.set(-0.18, 0.1, 0.08);
    root.traverse((object) => {
      if (object.isMesh) {
        object.castShadow = true;
        object.receiveShadow = true;
      }
      if (object.isBone) {
        boneMap.set(object.name, object);
        initialQuaternions.set(object.name, object.quaternion.clone());
      }
    });
    scene.add(root);
    fitCamera(root);
    clips = gltf.animations;
    mixer = new THREE.AnimationMixer(root);
    bonesOutput.textContent = [...boneMap.keys()].join('\n');
    status.textContent = `Loaded hand_model.glb\nBones: ${boneMap.size}\nAnimations: ${clips.map((clip) => clip.name).join(', ') || 'none'}`;
  },
  (event) => {
    if (event.total) status.textContent = `Loading hand_model.glb… ${Math.round(event.loaded / event.total * 100)}%`;
  },
  (error) => {
    console.error(error);
    status.textContent = 'Could not load the GLB. Serve this directory over HTTP; file:// is blocked by browser module/CORS rules.';
  }
);

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  if (mixer) mixer.update(delta);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>

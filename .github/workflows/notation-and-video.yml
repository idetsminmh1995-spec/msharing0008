name: notation-and-video

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install notation dependencies
        run: npm ci --prefix Engine/notation-engine
      - name: Test shared asset loader
        run: node tools/test-asset-loader.mjs
      - name: Test outro failure cache
        run: node tools/test-outro-video.mjs
      - name: Test Piano MusicXML-only flow
        run: node tools/test-piano-musicxml-only.mjs
      - name: Verify notation engine
        run: npm run verify --prefix Engine/notation-engine
      - uses: browser-actions/setup-chrome@v2
        id: setup-chrome
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Install ffprobe and expose Chrome as Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          sudo ln -sf "${{ steps.setup-chrome.outputs.chrome-path }}" /usr/local/bin/chromium
          echo "CHROMIUM_PATH=${{ steps.setup-chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
          chromium --version
      - name: Browser video-engine smoke test
        run: node tools/test-video-engine-browser.mjs
      - name: Browser Drum rollout acceptance
        run: node tools/test-drum-rollout-browser.mjs
      - name: Browser cross-page rollout acceptance
        run: node tools/test-cross-page-rollout-browser.mjs

<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Open, create, or scan a music score in Notation Lab." />
    <title>Notation Lab — M Sharing</title>
    <link rel="stylesheet" href="styles.css?v=notation-entry-20261115" />
  </head>
  <body>
    <header class="site-header" data-header>
      <div class="header-shell">
        <a class="brand" href="index.html#home" aria-label="M Sharing home"><span class="brand-mark" aria-hidden="true">M</span><span class="brand-name">Sharing</span></a>
        <nav class="desktop-nav" aria-label="Primary navigation">
          <a class="nav-link" href="index.html#courses">Courses</a><a class="nav-link" href="index.html#store">Store</a><a class="nav-link" href="index.html#create-video">Create Video</a><a class="nav-link is-active" href="notation.html" aria-current="page">Notation Lab</a>
        </nav>
        <div class="header-actions">
          <button class="icon-button theme-button" type="button" aria-label="Switch to light mode" data-theme-toggle><svg class="theme-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5" /><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l-1.41-1.41M17.66 6.34l1.41-1.41" /></svg><svg class="theme-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 15.3A8.5 8.5 0 0 1 8.7 3.5 8.5 8.5 0 1 0 20.5 15.3Z" /></svg></button>
        </div>
      </div>
    </header>
    <main class="notation-entry" aria-labelledby="notation-entry-title">
      <section class="notation-entry__intro">
        <p class="notation-entry__eyebrow">M SHARING · MUSIC WORKSPACE</p>
        <h1 id="notation-entry-title">Notation Lab</h1>
        <p>Choose how you want to start.</p>
      </section>
      <section class="notation-entry__actions" aria-label="Notation Lab actions">
        <input class="notation-entry__file" type="file" accept=".musicxml,.xml,.mxl,application/vnd.recordare.musicxml+xml,application/vnd.recordare.musicxml" data-notation-open-input />
        <button class="notation-entry__card notation-entry__card--open" type="button" data-notation-open>
          <span class="notation-entry__icon" aria-hidden="true">↗</span><span class="notation-entry__content"><strong>Open File</strong><small>Open a MusicXML or MXL score</small></span><span class="notation-entry__arrow" aria-hidden="true">→</span>
        </button>
        <button class="notation-entry__card notation-entry__card--create" type="button" data-notation-create>
          <span class="notation-entry__icon" aria-hidden="true">+</span><span class="notation-entry__content"><strong>Create</strong><small>Start a new score in the Editor</small></span><span class="notation-entry__arrow" aria-hidden="true">→</span>
        </button>
        <button class="notation-entry__card notation-entry__card--scan" type="button" disabled aria-describedby="notation-scan-status">
          <span class="notation-entry__icon" aria-hidden="true">⌁</span><span class="notation-entry__content"><strong>Scan</strong><small id="notation-scan-status">Coming soon</small></span><span class="notation-entry__arrow" aria-hidden="true">—</span>
        </button>
      </section>
      <p class="notation-entry__feedback" data-notation-feedback role="status" aria-live="polite" hidden></p>
    </main>
    <script src="script.js?v=mobile-sidebar-20261114"></script>
    <script src="notation-entry.js?v=entry-flow-20261115"></script>
  </body>
</html>

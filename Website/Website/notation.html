    <main class="notation-page" data-notation-page>
      <h1 class="notation-sr-only">Notation Lab</h1>
      <span class="notation-sr-only" data-file-name hidden>No file selected</span>
      <p class="notation-status notation-sr-only" role="status" aria-live="polite" data-status>Select a MusicXML file to begin.</p>
      <section class="notation-stage" data-stage data-layout="page" aria-label="Music notation" hidden>
        <div class="notation-score" data-score></div>
      </section>
      <section class="notation-diagnostics" data-diagnostics hidden aria-label="Notation diagnostics"></section>

      <aside class="notation-dock" aria-label="MusicXML and notation controls">
        <div class="notation-dock-inner">
          <section class="notation-import" data-drop-zone aria-label="Import MusicXML">
            <input class="notation-file-input" type="file" accept=".musicxml,.xml,.mxl,application/vnd.recordare.musicxml+xml,application/vnd.recordare.musicxml" data-file-input />
            <button class="notation-button notation-button--primary notation-file-button" type="button" data-choose-file aria-label="Choose MusicXML file">Choose file</button>
          </section>
          <section class="notation-toolbar" aria-label="Notation controls" data-controls hidden>
            <div class="notation-toolbar-group notation-view-switch" role="group" aria-label="Notation layout">
              <button type="button" class="notation-button is-selected" data-layout="page" aria-pressed="true">Page</button>
              <button type="button" class="notation-button" data-layout="scroll" aria-pressed="false">Horizontal</button>
            </div>
            <div class="notation-toolbar-group notation-playback-controls" role="group" aria-label="Playback controls">
              <button class="notation-button notation-button--play" type="button" data-play aria-label="Play" disabled>▶</button>
              <div class="notation-zoom-controls" role="group" aria-label="Notation size">
                <button class="notation-button notation-zoom-button" type="button" data-zoom-out aria-label="Zoom out" disabled>−</button>
                <output data-zoom-value aria-live="polite">100%</output>
                <button class="notation-button notation-zoom-button" type="button" data-zoom-in aria-label="Zoom in" disabled>+</button>
              </div>
              <label class="notation-volume"><span>Volume</span><input type="range" min="0" max="100" value="75" data-volume aria-label="Volume" /><output data-volume-value>75%</output></label>
            </div>
            <button class="notation-button notation-button--pdf" type="button" data-download-pdf disabled>Download PDF</button>
          </section>
        </div>
      </aside>
    </main>

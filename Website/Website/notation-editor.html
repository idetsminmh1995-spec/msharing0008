<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Notation Lab score editor." />
    <title>Notation Lab Editor — M Sharing</title>
    <link rel="stylesheet" href="styles.css?v=editor-shell-20261115" />
  </head>
  <body class="notation-editor-page">
    <main class="score-editor" data-editor-workspace>
      <header class="score-editor__bar">
        <a class="score-editor__brand" href="notation.html" aria-label="Back to Notation Lab"><span aria-hidden="true">←</span><strong>Notation Lab</strong></a>
        <div class="score-editor__project"><span class="score-editor__eyebrow">SCORE</span><strong data-editor-title>Untitled score</strong></div>
        <div class="score-editor__actions">
          <input class="score-editor__file" type="file" accept=".musicxml,.xml,.mxl,application/vnd.recordare.musicxml+xml,application/vnd.recordare.musicxml" data-file-input />
          <button type="button" data-editor-open>Open file</button>
          <button type="button" disabled title="Available after M1 editing foundation">Save</button>
        </div>
      </header>
      <section class="score-editor__workspace">
        <aside class="score-editor__rail" aria-label="Editor mode">
          <button class="is-active" type="button" aria-pressed="true">Select</button>
          <button type="button" disabled title="Note entry arrives in M2">Write</button>
          <button type="button" disabled title="Layout editing arrives in M3">Layout</button>
        </aside>
        <section class="score-editor__stage" aria-label="Score canvas">
          <div class="score-editor__empty" data-editor-empty>
            <span class="score-editor__empty-mark" aria-hidden="true">𝄞</span>
            <h1>Start with a score</h1>
            <p>Open MusicXML or MXL, or return to Notation Lab and create a new score.</p>
            <button type="button" data-editor-open>Open a score</button>
          </div>
          <div class="score-editor__canvas" data-score-canvas hidden></div>
        </section>
        <aside class="score-editor__inspector" aria-label="Score inspector">
          <p class="score-editor__eyebrow">INSPECTOR</p>
          <h2>Score</h2>
          <p>Selection, note entry, part settings, and engraving controls are added through the M1–M6 editor roadmap.</p>
          <a href="../Plan/Notation-Lab-UI-UX-Plan.md">View plan</a>
        </aside>
      </section>
      <footer class="score-editor__transport">
        <output data-editor-status role="status" aria-live="polite">Ready.</output>
        <div><button type="button" data-editor-zoom-out aria-label="Zoom out">−</button><output data-editor-zoom>100%</output><button type="button" data-editor-zoom-in aria-label="Zoom in">+</button></div>
      </footer>
    </main>
    <script src="assets/notation-engine.js?v=cdd3b038b040"></script>
    <script src="notation-workspace.js?v=editor-shell-20261115"></script>
    <script src="notation-editor-handoff.js?v=entry-handoff-20261115"></script>
  </body>
</html>

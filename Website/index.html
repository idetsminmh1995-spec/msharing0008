<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="M Sharing responsive header bar" />
    <title>M Sharing — Header Preview</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header" data-header>
      <div class="header-shell">
        <a class="brand" href="#" aria-label="M Sharing home">
          <span class="brand-mark" aria-hidden="true">M</span>
          <span class="brand-name">Sharing</span>
        </a>

        <nav class="desktop-nav" aria-label="Primary navigation">
          <a class="nav-link is-active" href="#">Home</a>
          <a class="nav-link" href="#courses">Courses</a>
          <a class="nav-link" href="#store">Store</a>
          <a class="nav-link" href="#create">Create</a>
          <a class="nav-link" href="#library">Library</a>
        </nav>

        <div class="header-actions">
          <label class="search-box" for="site-search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m2.1-5.4a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z" /></svg>
            <input id="site-search" type="search" placeholder="Search music, courses, notes..." />
          </label>
          <button class="icon-button notification-button" type="button" aria-label="Notifications">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9Zm-8.5 12h5" /></svg>
            <span class="notification-dot" aria-hidden="true"></span>
          </button>
          <button class="profile-button" type="button" aria-label="Open profile menu">
            <span class="avatar">AP</span>
            <svg class="profile-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5" /></svg>
          </button>
          <button class="menu-button icon-button" type="button" aria-label="Open navigation menu" aria-expanded="false" data-menu-toggle>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
          </button>
        </div>
      </div>

      <nav class="mobile-nav" aria-label="Mobile navigation" data-mobile-nav>
        <a class="nav-link is-active" href="#">Home</a>
        <a class="nav-link" href="#courses">Courses</a>
        <a class="nav-link" href="#store">Store</a>
        <a class="nav-link" href="#create">Create</a>
        <a class="nav-link" href="#library">Library</a>
      </nav>
    </header>

    <main class="preview-content">
      <p>Header Bar preview</p>
    </main>
    <script src="script.js"></script>
  </body>
</html>
